[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hosty-panel"
version = "0.1.0"
description = "A small, self-hosted website hosting panel"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
hosty = "hosty.cli:main"

[tool.setuptools.package-data]
hosty = ["static/*"]
